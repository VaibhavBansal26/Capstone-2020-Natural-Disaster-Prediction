{# Expects: title, error; optional retry_endpoint and retry_target (CSS selector) #}
<div role="alert" class="rounded-lg border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800">
  <p class="break-words"><strong class="font-semibold">{{ title }}</strong> {{ error }}</p>
  {% if retry_endpoint is defined and retry_endpoint %}
  <button type="button" class="mt-3 rounded-md border border-rose-300 bg-white px-3 py-1.5 text-xs font-medium text-rose-800 hover:bg-rose-100"
          hx-get="{{ url_for(retry_endpoint) }}" hx-target="{{ retry_target }}" hx-swap="innerHTML">Try again</button>
  {% endif %}
</div>
